name: Daily hydrology paper brief

on:
  schedule:
    # 00:37 UTC is 08:37 China Standard Time.
    - cron: "37 21 * * *"
  workflow_dispatch:
    inputs:
      refresh_source_run_id:
        description: "Today's original run to refresh under current rules"
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download original edition for same-day refresh
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: wechat-post-output
          path: work/source/
          run-id: ${{ inputs.refresh_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Send daily email brief
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEVANCE_MODEL: ${{ secrets.OPENAI_RELEVANCE_MODEL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          REFRESH_SOURCE_RUN_ID: ${{ inputs.refresh_source_run_id }}
        run: |
          if [ -n "$REFRESH_SOURCE_RUN_ID" ]; then
            source_file=$(find work/source -name 'selected-papers-*.json' | sort | tail -n 1)
            test -n "$source_file"
            python refresh_wechat_post.py "$source_file"
            python -c "import main as b; from generate_wechat_post import latest_selected_papers_path, load_selected_papers; from datetime import datetime, timezone, timedelta; stamp=datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d'); b.send_email('Daily hydrology paper brief - '+stamp+' (updated)', b.build_email_body(load_selected_papers(latest_selected_papers_path())))"
          else
            python main.py
          fi

      - name: Generate WeChat HTML article
        if: success() && inputs.refresh_source_run_id == ''
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python generate_wechat_post.py

      - name: Upload generated WeChat article
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-post-output
          path: outputs/

      - name: Commit updated sent DOI list
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- sent_dois.json outputs/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_dois.json outputs/
            git commit -m "Update daily brief outputs"
            git push
          else
            echo "No daily brief output updates to commit."
          fi
